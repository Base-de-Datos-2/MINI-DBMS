# Evaluation: `docker compose up --build`, then open http://localhost:8000
# One tab per part: Relacional, Espacial, Texto and Multimedia.
# One process owns every part's data directory inside the image.
# `docker compose down` discards changes; the next `up` starts clean.
services:
  minidbms:
    build: .
    image: minidbms:demo
    restart: unless-stopped
    command: ["python", "-m", "api", "--all", "--host", "0.0.0.0", "--port", "8000", "--allow-writes"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/parts')"]
      interval: 10s
      timeout: 5s
      retries: 5
