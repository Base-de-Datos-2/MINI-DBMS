name: Demo regression
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'data/text_demo/**'
      - 'data/multimedia_demo/**'
      - 'PART_05/corpus*.json'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/demo-regression.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run build
  integrated-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MINIDBMS_ACADEMIC_CORPUS: extended
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/check_extended_demo.py
      - if: failure()
        run: docker compose logs --tail=100
