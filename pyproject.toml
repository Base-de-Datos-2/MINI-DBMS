[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-dbms"
version = "0.1.0"
description = "Educational multimodal database engine - relational foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Offline source decoding only; no required DBMS algorithm uses PyArrow.
corpus = ["pyarrow>=16,<27"]
# Offline academic PDF preparation, using the extractor verified in Stage 1.
academic = ["pypdf==7.0.0"]
# Starlette 1.6 still imports an alias that anyio 4.15 deprecates. The strict
# suite runs with warnings as errors, so anyio stays below 4.15 until that is
# fixed upstream; httpx2 is what Starlette's test client now expects.
test = [
    "pytest>=8,<9",
    "fastapi>=0.110,<1",
    "httpx2>=2,<3",
    "anyio>=4,<4.15",
    # Part 4 feature tests (same pins as the multimedia extra).
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<6",
    "soundfile>=0.12,<1",
    "librosa>=0.11,<2",
]
# Part 4 feature extraction helpers only: decoding, SIFT, MFCC and the
# vocabulary K-Means (scikit-learn, installed by librosa). IVF, HNSW, the
# vector store and TF-IDF are our own code (docs/multimedia-contract.md §7).
multimedia = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<6",
    "soundfile>=0.12,<1",
    "librosa>=0.11,<2",
]
# Stage 10 charts: `python -m benchmarks report` renders them from raw results.
bench = [
    "matplotlib>=3.8,<4",
]
# Stage 9 HTTP interface: run it from the repository root with `python -m api`.
api = [
    "fastapi>=0.110,<1",
    "httpx2>=2,<3",
    "uvicorn>=0.29,<1",
    "anyio>=4,<4.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine", "engine.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
